<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Painéis Ruah — Balneário Camboriú</title>
<meta name="description" content="Painéis de LED da Ruah espalhados pelos melhores pontos de Balneário Camboriú. Explore o mapa e veja cada ponto de perto." />
<meta property="og:title" content="Painéis Ruah — Balneário Camboriú" />
<meta property="og:description" content="Onde marcas ganham vida. Veja no mapa os pontos de mídia OOH da Ruah em Balneário Camboriú." />
<link rel="icon" type="image/png" href="icon-180.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --ink: #0c1826;
    --navy: #14243e;
    --gold: #d4af6a;
    --gold-soft: rgba(212, 175, 106, .38);
    --paper: #f2ede1;
    --mist: rgba(255, 255, 255, .74);
    --mist-dim: rgba(255, 255, 255, .5);
    --linha: #e4dcc9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--paper);
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #mapa {
    position: absolute;
    inset: 0;
    background: var(--paper);
  }

  .leaflet-control-attribution {
    font-size: 10px !important;
    background: rgba(242, 237, 225, .82) !important;
  }

  /* -------- cartão de marca flutuante -------- */
  .cartao-marca {
    position: absolute;
    top: clamp(14px, 3vw, 26px);
    left: clamp(14px, 3vw, 26px);
    z-index: 500;
    background: rgba(255, 255, 255, .95);
    backdrop-filter: blur(14px);
    border: 1px solid var(--linha);
    border-radius: 18px;
    padding: 20px 22px 18px;
    box-shadow: 0 4px 10px rgba(20, 36, 62, .06), 0 22px 46px rgba(20, 36, 62, .16);
    max-width: min(78vw, 314px);
    overflow: hidden;
    isolation: isolate;
  }

  .cartao-marca::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), rgba(212, 175, 106, 0));
  }

  .onda-fundo {
    position: absolute;
    right: -16px;
    bottom: -18px;
    width: 128px;
    height: 128px;
    z-index: -1;
    pointer-events: none;
  }

  .onda-fundo path { stroke: var(--navy); opacity: .05; }

  .cartao-marca img.logo-cartao { height: 17px; display: block; }

  .eyebrow-cartao {
    display: block;
    margin-top: 13px;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--gold-escuro, #b8935a);
    font-weight: 700;
  }

  .cartao-marca h1 {
    margin: 6px 0 8px;
    font-family: ui-serif, "Iowan Old Style", Georgia, serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--navy);
    line-height: 1.18;
  }

  .cartao-marca p {
    margin: 0;
    font-size: 12.5px;
    color: #6b7684;
    line-height: 1.55;
  }

  .cartao-marca .contagem {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--linha);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--navy);
    font-weight: 700;
  }

  .contagem .ponto-dourado { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

  /* -------- marcador -------- */
  .marcador-ruah { background: none; border: none; }

  .marcador-pin {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    animation: entrada-marcador .5s cubic-bezier(.2, .8, .3, 1.2) backwards;
  }

  .marcador-pulso {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--gold);
    opacity: .5;
    animation: pulso 2.6s ease-out infinite;
  }

  @keyframes pulso {
    0%   { transform: scale(.75); opacity: .5; }
    70%  { opacity: 0; }
    100% { transform: scale(2.3); opacity: 0; }
  }

  @keyframes entrada-marcador {
    from { opacity: 0; transform: translateY(10px) scale(.5); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .marcador-corpo {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--gold);
    border: 2.5px solid var(--navy);
    box-shadow: 0 3px 10px rgba(12, 24, 38, .4), 0 1px 3px rgba(12, 24, 38, .3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease;
  }

  .marcador-onda { width: 13px; height: 13px; display: block; }
  .marcador-onda path { stroke: var(--navy); }

  .marcador-pin:hover .marcador-corpo, .marcador-pin.previa-ativa .marcador-corpo { transform: scale(1.2); }

  @media (prefers-reduced-motion: reduce) {
    .marcador-pulso { animation: none; display: none; }
    .marcador-pin { animation: none; }
  }

  .marcador-previa {
    position: absolute;
    bottom: calc(100% + 12px);
    left: 50%;
    transform: translateX(-50%) translateY(6px) scale(.94);
    width: 152px;
    background: #fff;
    border-radius: 13px;
    overflow: hidden;
    box-shadow: 0 16px 34px rgba(12, 24, 38, .32);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
    z-index: 10;
  }

  .marcador-previa::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 12px;
    height: 12px;
    background: #fff;
  }

  .marcador-previa img { width: 100%; height: 92px; object-fit: cover; display: block; }

  .marcador-previa .previa-nome {
    display: block;
    padding: 8px 10px 9px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.3;
  }

  .marcador-pin.previa-ativa .marcador-previa { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

  /* -------- visor em tela cheia -------- */
  #visor {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--ink);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s ease;
  }

  #visor.aberto { opacity: 1; pointer-events: auto; }

  .slide { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; }

  .camada-foto { position: absolute; inset: 0; transition: opacity .38s ease; }

  .camada-foto img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 38%;
    transform: scale(1.045);
    animation: respirar 26s ease-in-out infinite alternate;
  }

  .conteudo { transition: opacity .3s ease, transform .38s ease; }
  .conteudo.saindo { opacity: 0; transform: translateY(6px); }

  @media (prefers-reduced-motion: reduce) {
    .camada-foto img { animation: none; transform: scale(1); }
    .camada-foto, .conteudo { transition: none; }
  }

  @keyframes respirar {
    from { transform: scale(1.045); }
    to   { transform: scale(1.09); }
  }

  .veu-topo {
    position: absolute; inset: 0 0 auto 0; height: 34%;
    background: linear-gradient(to bottom, rgba(6, 12, 22, .58), rgba(6, 12, 22, 0));
    z-index: 1; pointer-events: none;
  }

  .veu-base {
    position: absolute; inset: auto 0 0 0; height: 26%;
    background: linear-gradient(to top, rgba(8, 15, 26, .95) 0%, rgba(9, 17, 29, .84) 42%, rgba(10, 19, 32, .32) 78%, rgba(10, 19, 32, 0) 100%);
    z-index: 1; pointer-events: none;
  }

  .cromo-topo {
    position: absolute; inset: 0 0 auto 0; z-index: 4;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: clamp(18px, 3.4vw, 40px) clamp(20px, 4vw, 48px) 0;
  }

  .marca { display: flex; align-items: center; gap: 10px; pointer-events: none; }
  .marca img { height: clamp(14px, 1.6vw, 20px); display: block; opacity: .96; }
  .marca .rotulo { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--mist-dim); font-weight: 600; padding-top: 1px; }

  .topo-direita { display: flex; align-items: center; gap: 14px; }

  .contador {
    font-size: 11.5px; letter-spacing: .14em; color: var(--mist);
    font-variant-numeric: tabular-nums; font-weight: 600;
    display: flex; align-items: baseline; gap: 5px;
  }
  .contador .atual { color: var(--gold); font-size: 13.5px; }
  .contador .barra { color: var(--mist-dim); font-weight: 400; }

  .btn-fechar {
    width: 32px; height: 32px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .28);
    background: rgba(8, 15, 26, .3);
    color: rgba(255, 255, 255, .85);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; transition: background .15s ease;
  }
  .btn-fechar:hover { background: rgba(8, 15, 26, .55); }

  .seta {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: clamp(34px, 4vw, 46px); height: clamp(34px, 4vw, 46px);
    border-radius: 999px; border: 1px solid rgba(255, 255, 255, .22);
    background: rgba(8, 15, 26, .28); backdrop-filter: blur(6px);
    color: rgba(255, 255, 255, .82);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .seta:hover { background: rgba(8, 15, 26, .5); border-color: rgba(255, 255, 255, .4); }
  .seta:active { transform: translateY(-50%) scale(.92); }
  .seta.esq { left: clamp(14px, 2.6vw, 32px); }
  .seta.dir { right: clamp(14px, 2.6vw, 32px); }

  .zona-clique { position: absolute; inset: 0 50% 0 0; z-index: 2; cursor: pointer; }
  .zona-clique.dir { inset: 0 0 0 50%; }

  .cromo-base { position: absolute; inset: auto 0 0 0; z-index: 2; padding: 0 clamp(20px, 4vw, 48px) clamp(22px, 4vw, 40px); pointer-events: none; }

  .rodape {
    padding-top: clamp(14px, 2vw, 20px);
    border-top: 1px solid var(--gold-soft);
    display: flex; align-items: center; justify-content: space-between;
    gap: clamp(20px, 4vw, 40px); flex-wrap: wrap;
  }

  .info-ponto { display: flex; flex-direction: column; gap: clamp(4px, .8vw, 7px); flex: 1 1 auto; min-width: 0; }

  h2.nome-ponto {
    margin: 0; font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    font-weight: 500; font-size: clamp(18px, 2.5vw, 27px); line-height: 1.08; color: #fbf8f2; text-wrap: balance;
  }

  .endereco { margin: 0; font-size: clamp(11.5px, 1.15vw, 13.5px); color: var(--mist-dim); letter-spacing: .01em; }

  .specs { display: flex; flex-wrap: wrap; gap: clamp(8px, 1.4vw, 12px); flex: 0 0 auto; }
  .spec { display: flex; flex-direction: column; gap: 3px; }
  .spec .rotulo-spec { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mist-dim); font-weight: 600; }
  .spec .valor-spec { font-size: clamp(13px, 1.4vw, 15px); color: #f4f1ea; font-weight: 600; font-variant-numeric: tabular-nums; }
  .divisor-spec { width: 1px; align-self: stretch; background: rgba(255, 255, 255, .14); margin: 2px 2px; }

  @media (max-width: 560px) {
    .cartao-marca { max-width: calc(100vw - 28px); }
  }
</style>
</head>

    marcador.on('mouseover', function () {
      var el = marcador.getElement();
      var pin = el && el.querySelector('.marcador-pin');
      if (pin) pin.classList.add('previa-ativa');
    });
    marcador.on('mouseout', function () {
      var el = marcador.getElement();
      var pin = el && el.querySelector('.marcador-pin');
      if (pin) pin.classList.remove('previa-ativa');
    });
  });

  // -------- visor --------
  var indice = 0;
  var animando = false;
  var reduzMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var elVisor = document.getElementById('visor');
  var elFoto = document.getElementById('foto');
  var elCamadaFoto = document.getElementById('camadaFoto');
  var elConteudo = document.getElementById('conteudo');
  var elContador = document.getElementById('contadorAtual');
  var elNome = document.getElementById('nomePonto');
  var elEndereco = document.getElementById('enderecoPonto');
  var elEstrutura = document.getElementById('specEstrutura');
  var elResolucao = document.getElementById('specResolucao');
  var elAlcance = document.getElementById('specAlcance');

  function preencher(i) {
    var p = PONTOS[i];
    elFoto.src = p.foto;
    elFoto.alt = 'Painel de LED Ruah — ' + p.nome;
    elNome.textContent = p.nome;
    elEndereco.textContent = p.endereco;
    elEstrutura.textContent = 'LED · ' + p.tamanho;
    elResolucao.textContent = p.resolucao;
    elAlcance.textContent = p.impacto;
    elContador.textContent = String(i + 1).padStart(2, '0');
  }

  function abrirVisor(i) {
    indice = i;
    preencher(indice);
    elVisor.classList.add('aberto');
    document.body.style.overflow = 'hidden';
  }

  function fecharVisor() {
    elVisor.classList.remove('aberto');
    document.body.style.overflow = '';
  }

  function irPara(novoIndice) {
    if (animando) return;
    indice = (novoIndice + PONTOS.length) % PONTOS.length;

    if (reduzMovimento) { preencher(indice); return; }

    animando = true;
    elCamadaFoto.style.opacity = '0';
    elConteudo.classList.add('saindo');
    setTimeout(function () {
      preencher(indice);
      elCamadaFoto.style.opacity = '1';
      elConteudo.classList.remove('saindo');
      setTimeout(function () { animando = false; }, 380);
    }, 220);
  }

  document.getElementById('btnFechar').addEventListener('click', fecharVisor);
  document.getElementById('btnAnterior').addEventListener('click', function (ev) { ev.stopPropagation(); irPara(indice - 1); });
  document.getElementById('btnProximo').addEventListener('click', function (ev) { ev.stopPropagation(); irPara(indice + 1); });
  document.getElementById('zonaEsq').addEventListener('click', function () { irPara(indice - 1); });
  document.getElementById('zonaDir').addEventListener('click', function () { irPara(indice + 1); });

  document.addEventListener('keydown', function (ev) {
    if (!elVisor.classList.contains('aberto')) return;
    if (ev.key === 'ArrowLeft') irPara(indice - 1);
    if (ev.key === 'ArrowRight') irPara(indice + 1);
    if (ev.key === 'Escape') fecharVisor();
  });

  var toqueX = null;
  document.getElementById('visor').addEventListener('touchstart', function (ev) { toqueX = ev.touches[0].clientX; }, { passive: true });
  document.getElementById('visor').addEventListener('touchend', function (ev) {
    if (toqueX === null) return;
    var delta = ev.changedTouches[0].clientX - toqueX;
    if (Math.abs(delta) > 50) irPara(delta > 0 ? indice - 1 : indice + 1);
    toqueX = null;
  });
</script>
</body>
</html>
