<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruah · Pontos de mídia — Balneário Camboriú</title>
<meta name="description" content="Rede de painéis de LED da Ruah em Balneário Camboriú. Explore o mapa e veja cada ponto de perto.">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
:root{
  --ink:#14243e; --gold:#e0c389; --gold-dark:#a8853c; --gold-code-sel:#8a6a2a;
  --paper:#f2f4f8;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
  --sidebar:380px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--gold-dark)}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:rgba(20,36,62,.18);border-radius:6px}

/* ===== LAYOUT ===== */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:var(--sidebar);flex:none;display:flex;flex-direction:column;background:#fff;border-right:1px solid rgba(20,36,62,.08);z-index:2}
.side-head{background:var(--ink);color:#fff;padding:24px 26px 22px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brandrow img.logo-oficial{width:126px;height:auto;display:block}
.brandrow .cidade{font-size:9.5px;letter-spacing:.16em;color:rgba(255,255,255,.5);text-align:right}
h1.title{margin:22px 0 0;font-size:24px;font-weight:700;letter-spacing:-.02em}
p.lede{margin:9px 0 0;font-size:13px;line-height:1.6;color:rgba(255,255,255,.6)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:22px;background:rgba(255,255,255,.12);border-radius:12px;overflow:hidden}
.kpi{background:var(--ink);padding:14px 14px 13px}
.kpi .num{font-size:22px;font-weight:800;color:var(--gold);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .lbl{font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.5);margin-top:5px;font-weight:700}

.filters{padding:16px 20px 14px;border-bottom:1px solid rgba(20,36,62,.07)}
.filters-row{display:flex;flex-wrap:wrap;gap:7px}
.filters-row+.filters-row{margin-top:10px}
.chip{font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;
  border:1px solid rgba(20,36,62,.12);background:#fff;color:rgba(20,36,62,.62)}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--ink)}

.list{flex:1;overflow-y:auto}
.row{display:flex;gap:13px;padding:14px 20px;width:100%;text-align:left;border:0;
  border-bottom:1px solid rgba(20,36,62,.06);border-left:3px solid transparent;background:#fff;cursor:pointer;font:inherit;color:inherit}
.row[aria-current="true"]{border-left-color:var(--gold);background:rgba(224,195,137,.16)}
.row-thumb{width:62px;height:48px;border-radius:9px;flex:none;overflow:hidden;position:relative}
.row-code{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;font-weight:700;color:rgba(20,36,62,.4)}
.row[aria-current="true"] .row-code{color:var(--gold-code-sel)}
.row-name{font-size:14px;font-weight:600;margin-top:3px;line-height:1.3}
.row-meta{display:flex;gap:10px;font-size:11.5px;color:rgba(20,36,62,.55);margin-top:5px;flex-wrap:wrap}
.row-meta b{font-weight:700;color:rgba(20,36,62,.75)}
.rodape-side{padding:18px 22px 26px;font-size:11px;color:rgba(20,36,62,.4);line-height:1.6}
.vazio{padding:40px 22px;font-size:13px;line-height:1.6;color:rgba(20,36,62,.5);text-align:center}

.stage{position:relative;flex:1;min-width:0}
#map{position:absolute;inset:0;background:#dfe7ee}

.detail{position:absolute;top:22px;right:22px;width:330px;max-width:calc(100% - 44px);background:#fff;
  border-radius:16px;box-shadow:0 12px 40px rgba(20,36,62,.22);overflow:hidden;z-index:500}
.detail-body{padding:18px 20px 20px}
.detail-code{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--gold-dark)}
.detail-name{font-size:19px;font-weight:700;margin-top:7px;line-height:1.25}
.detail-addr{font-size:12.5px;color:rgba(20,36,62,.6);margin-top:10px;line-height:1.5}
.pill-specs{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.pill-spec{font-size:11.5px;background:var(--paper);border-radius:7px;padding:5px 10px;font-weight:600;color:rgba(20,36,62,.75)}
.impacto-linha{font-size:12.5px;font-weight:700;color:#2c7a52;margin-top:14px}
.insercoes-linha{font-size:12px;color:rgba(20,36,62,.55);margin-top:7px}
.link-maps{display:inline-block;margin-top:14px;font-size:12.5px;font-weight:700;color:var(--gold-dark)}
.link-maps:hover{color:var(--gold-code-sel)}

.legenda-mapa{position:absolute;left:22px;bottom:22px;background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(20,36,62,.16);
  padding:12px 16px;font-size:11.5px;color:rgba(20,36,62,.6);z-index:500;display:flex;align-items:center;gap:12px}
.legenda-mapa .item{display:flex;align-items:center;gap:7px}
.legenda-mapa .dot{width:12px;height:12px;border-radius:50%;display:block}

.leaflet-container{font-family:var(--sans)}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7)}

/* ===== PIN ===== */
.ruah-pin{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
  background:var(--ink);border:2.5px solid #fff;box-shadow:0 3px 10px rgba(20,36,62,.35);
  color:var(--gold);font-size:12px;font-weight:800;font-family:var(--sans);transition:transform .15s ease}
.ruah-pin-on{background:var(--gold);color:var(--ink);transform:scale(1.18)}

/* ===== FOTO: placeholder enquanto não há imagem (basta preencher p.foto) ===== */
.shot{position:relative;background-size:cover;background-position:center;background-color:#eceff5;width:100%;height:100%}
.shot.empty{background-image:repeating-linear-gradient(135deg,#eceff5 0 8px,#e4e8f0 8px 16px);display:grid;place-items:center}
.shot.empty span{font-family:var(--mono);font-size:7.5px;color:rgba(20,36,62,.4);text-align:center;line-height:1.2;padding:4px}
.shot[data-foto]{cursor:zoom-in}
.shot[data-foto]::after{content:'';position:absolute;inset:0;background:rgba(20,36,62,0);transition:background .15s ease}
.shot[data-foto]:hover::after{background:rgba(20,36,62,.12)}
.shot .lupa{position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;opacity:0;transition:opacity .15s ease;
  box-shadow:0 4px 10px rgba(0,0,0,.2)}
.shot[data-foto]:hover .lupa{opacity:1}

/* ===== LIGHTBOX ===== */
.lightbox{position:fixed;inset:0;z-index:2000;background:rgba(15,17,20,.92);
  display:flex;align-items:center;justify-content:center;padding:40px;
  opacity:0;pointer-events:none;transition:opacity .2s ease}
.lightbox.aberta{opacity:1;pointer-events:auto}
.lightbox img{max-width:min(1100px,100%);max-height:100%;border-radius:4px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.97);transition:transform .2s ease}
.lightbox.aberta img{transform:scale(1)}
.lightbox-legenda{position:absolute;left:0;right:0;bottom:22px;text-align:center;
  font:500 12px/1.4 var(--sans);color:rgba(255,255,255,.85);letter-spacing:.02em}
.lightbox-fechar{position:absolute;top:22px;right:26px;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;
  font-size:16px;cursor:pointer;display:grid;place-items:center}
.lightbox-fechar:hover{background:rgba(255,255,255,.18)}
@media (prefers-reduced-motion: reduce){
  .lightbox,.lightbox img{transition:none}
}
</style>
</head>

const BRL = n => 'R$ ' + n.toLocaleString('pt-BR');
const K   = n => n>=1e6 ? (n/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+'M'
              : n>=1e3 ? Math.round(n/1e3)+'k' : String(n);

/* ---------- mapa ---------- */
function panParaPonto(p){
  if(!map) return;
  const pt = map.latLngToContainerPoint([p.lat,p.lng]);
  const alvo = map.containerPointToLatLng([pt.x+180, pt.y]);
  map.panTo(alvo, {animate:true});
}

function initMap(){
  map = L.map('map',{zoomControl:true,attributionControl:true,fadeAnimation:false}).setView(CENTRO,ZOOM);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {subdomains:'abcd',maxZoom:20,detectRetina:true,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
  PONTOS.forEach(p=>{
    const numero = p.cod.replace('RUA-','');
    const icon = L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,17],
      html:'<div class="ruah-pin">'+numero+'</div>'});
    const m = L.marker([p.lat,p.lng],{icon,title:p.nome}).addTo(map);
    m.on('click',()=>{state.sel=p.id;render();panParaPonto(p);});
    markers[p.id]=m;
  });
  panParaPonto(PONTOS.find(x=>x.id===state.sel));
}

  const lista = PONTOS.filter(p=>
    (state.bairro==='todos'||p.bairro===state.bairro) &&
    (state.categoria==='todos'||p.categoria===state.categoria));

  document.getElementById('list').innerHTML =
    (lista.length ? lista.map(p=>
      '<button class="row" data-p="'+p.id+'" aria-current="'+(p.id===state.sel)+'">'
      + '<div class="row-thumb">'+shot(p,48)+'</div>'
      + '<div style="min-width:0;flex:1">'
        + '<div class="row-code">'+p.cod+'</div>'
        + '<div class="row-name">'+p.nome+'</div>'
        + '<div class="row-meta"><b>'+p.tamanho+'</b><span>'+K(p.imp)+' impactos/mês</span></div>'
      + '</div></button>').join('')
      : '<div class="vazio">Nenhum ponto nesta categoria ainda.</div>')
    + '<div class="rodape-side">Ruah Publicidade · Balneário Camboriú/SC · Onde marcas ganham vida</div>';

  Object.entries(markers).forEach(([id,m])=>{
    const el = m.getElement(); if(!el) return;
    const pto = PONTOS.find(p=>p.id===+id);
    const on = +id===state.sel;
    const vis = (state.bairro==='todos'||pto.bairro===state.bairro) && (state.categoria==='todos'||pto.categoria===state.categoria);
    const pinEl = el.querySelector('.ruah-pin');
    if(pinEl) pinEl.classList.toggle('ruah-pin-on',on);
    el.style.zIndex = on?'900':'';
    el.style.opacity = vis?'1':'.3';
  });

  const p = PONTOS.find(x=>x.id===state.sel);
  document.getElementById('detail').innerHTML =
    shot(p,150)
    + '<div class="detail-body">'
    + '<div class="detail-code">'+p.cod+'</div>'
    + '<div class="detail-name">'+p.nome+'</div>'
    + '<div class="detail-addr">'+p.endereco+'</div>'
    + '<div class="pill-specs"><span class="pill-spec">'+p.tamanho+'</span><span class="pill-spec">'+p.resolucao+'</span></div>'
    + '<div class="impacto-linha">'+K(p.imp)+' impactos/mês</div>'
    + '<div class="insercoes-linha">'+p.insercoes+'</div>'
    + '<a class="link-maps" href="'+mapsLink(p)+'" target="_blank" rel="noopener">Ver no Google Maps ↗</a>'
    + (MOSTRAR_PRECO ? '<div style="display:flex;align-items:baseline;gap:8px;margin-top:16px">'
      + '<span class="num" style="font-size:24px;color:var(--gold-dark)">'+BRL(p.preco)+'</span>'
      + '<span style="font-size:11px;color:rgba(20,36,62,.45)">/mês</span></div>' : '')
    + '</div>';
}

document.getElementById('filtersCat').onclick = e=>{
  const b=e.target.closest('[data-c]'); if(b){state.categoria=b.dataset.c;render();}
};
document.getElementById('filters').onclick = e=>{
  const b=e.target.closest('[data-f]'); if(b){state.bairro=b.dataset.f;render();}
};
document.getElementById('list').onclick = e=>{
  if(e.target.closest('[data-foto]'))return;
  const b=e.target.closest('[data-p]'); if(!b)return;
  state.sel=+b.dataset.p;
  render();
  panParaPonto(PONTOS.find(x=>x.id===state.sel));
};

/* ---------- lightbox (foto ampliada) ---------- */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxLegenda = document.getElementById('lightbox-legenda');
function abrirLightbox(foto,legenda){
  lightboxImg.src = foto;
  lightboxLegenda.textContent = legenda || '';
  lightbox.classList.add('aberta');
}
function fecharLightbox(){
  lightbox.classList.remove('aberta');
  lightboxImg.src = '';
}
document.addEventListener('click', e=>{
  const s=e.target.closest('[data-foto]'); if(!s)return;
  e.stopPropagation();
  abrirLightbox(s.dataset.foto, s.dataset.legenda);
});
document.getElementById('lightbox-fechar').onclick = fecharLightbox;
lightbox.onclick = e=>{ if(e.target===lightbox) fecharLightbox(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') fecharLightbox(); });

initMap();
render();
</script>
</body>
</html>
