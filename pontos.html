<style>
/* ===== TOKENS ===== */
:root{
  --ink:#0e2138; --ink-2:#23262b; --gold:#e0c389; --gold-lt:#e3cfa5;
  --paper:#f7f4ee; --paper-2:#efeae0; --line:rgba(21,23,26,.10);
  --sans:'Archivo',Helvetica,Arial,sans-serif;
  --serif:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sidebar:392px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--gold)}a:hover{color:#a8874f}

/* ===== LAYOUT ===== */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh;min-height:600px}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.side-head{position:relative;overflow:hidden;padding:26px 26px 18px;background:var(--ink)}
.side-head::before{content:'';position:absolute;top:-70px;right:-70px;width:220px;height:220px;
  border-radius:50%;background:radial-gradient(circle,rgba(224,195,137,.24) 0%,rgba(224,195,137,0) 70%);
  pointer-events:none}
.brandrow{position:relative;display:flex;align-items:center;gap:8px;margin-bottom:20px}
.brandrow img.logo-oficial{height:20px;display:block}
h1.title{position:relative;font-family:var(--serif);font-weight:400;font-size:31px;line-height:1.12;margin:0 0 8px;letter-spacing:-.015em;color:#fff}
p.lede{position:relative;font:400 12.5px/1.6 var(--sans);color:rgba(255,255,255,.65);margin:0 0 18px;max-width:32ch}
.kpis{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14)}
.kpi{background:var(--ink);padding:11px 12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:14px 26px;border-bottom:1px solid var(--line)}
.list{overflow-y:auto;flex:1}
.stage{position:relative}
#map{position:absolute;inset:0;background:var(--paper-2)}
.detail{position:absolute;right:22px;top:22px;width:326px;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 22px 50px -24px rgba(0,0,0,.4);overflow:hidden;z-index:500}

/* ===== ATOMS ===== */
.mono-lbl{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.num{font-family:var(--serif);font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;
  font:500 11px/1 var(--sans);color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.row{display:grid;grid-template-columns:74px 1fr;gap:14px;width:100%;text-align:left;padding:15px 26px;
  border:0;border-bottom:1px solid var(--line);background:transparent;font:inherit;color:inherit;cursor:pointer}
.row:hover{background:rgba(255,255,255,.6)}
.row[aria-current="true"]{background:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.row-name{font-family:var(--serif);font-size:17px;line-height:1.25;margin:3px 0 5px}
.row-meta{display:flex;gap:14px;font:400 11px/1 var(--sans);color:rgba(21,23,26,.55)}
.row-meta b{font-weight:600;color:var(--ink)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:16px}
.spec{background:#fff;padding:10px 12px}
.spec .v{font:500 14px/1.3 var(--sans);margin-top:4px}

/* ===== info do painel (mesmos campos do catalogo) ===== */
.endereco-linha{display:flex;gap:6px;font:400 12.5px/1.45 var(--sans);color:rgba(21,23,26,.6);margin-top:6px}
.pill-specs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pill-spec{background:var(--paper-2);border-radius:8px;padding:4px 10px;font:600 12px/1.4 var(--sans);color:var(--ink)}
.impacto-linha{display:flex;align-items:center;gap:6px;font:700 13px/1.4 var(--sans);color:var(--ink);margin-top:10px}
.insercoes-linha{display:flex;align-items:center;gap:6px;font:400 12.5px/1.4 var(--sans);color:rgba(21,23,26,.5);margin-top:6px}
.link-maps{display:inline-block;margin-top:10px;font:600 12.5px/1 var(--sans);color:var(--gold);
  text-decoration:none;border-bottom:1px dotted var(--gold)}
.link-maps:hover{color:#a8874f;border-color:#a8874f}
.vazio{padding:40px 26px;font:400 13px/1.6 var(--sans);color:rgba(21,23,26,.5);text-align:center}
.list::-webkit-scrollbar{width:9px}
.list::-webkit-scrollbar-thumb{background:rgba(21,23,26,.18);border-radius:9px;border:3px solid transparent;background-clip:content-box}

/* ===== MAPA: cores naturais do basemap, sem filtro ===== */
.leaflet-container{font-family:var(--sans)}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7)}

/* ===== PIN (onda Ruah) ===== */
.pin{position:relative;display:grid;place-items:center;transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.pin .bubble img{width:18px !important;height:18px !important;max-width:none}
.pin .bubble{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--paper);border:1.5px solid var(--ink);box-shadow:0 5px 14px -4px rgba(0,0,0,.5)}
.pin .tip{position:absolute;bottom:-5px;width:9px;height:9px;background:var(--paper);
  border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
.pin .halo{position:absolute;inset:-9px;border-radius:50%;border:1.5px solid var(--gold);opacity:0}
.pin.sel{transform:scale(1.22)}
.pin.sel .bubble,.pin.sel .tip{background:var(--gold)}
.pin.sel .halo{opacity:.9;animation:ping 1.9s ease-out infinite}
@keyframes ping{0%{transform:scale(.75);opacity:.85}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}

/* ===== FOTO: placeholder enquanto não há imagem (basta preencher p.foto) ===== */
.shot{position:relative;background-size:cover;background-position:center;background-color:var(--paper-2)}
.shot.empty{background-image:repeating-linear-gradient(115deg,rgba(21,23,26,.055) 0 7px,rgba(21,23,26,0) 7px 14px);
  display:grid;place-items:center}
.shot.empty span{font:500 8.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:rgba(21,23,26,.42);text-align:center;padding:4px}
.shot[data-foto]{cursor:zoom-in}
.shot[data-foto]::after{content:'';position:absolute;inset:0;background:rgba(21,23,26,0);transition:background .15s ease}
.shot[data-foto]:hover::after{background:rgba(21,23,26,.12)}
.shot .lupa{position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;opacity:0;transition:opacity .15s ease;
  box-shadow:0 4px 10px rgba(0,0,0,.2)}
.shot[data-foto]:hover .lupa{opacity:1}

/* ===== LIGHTBOX ===== */
.lightbox{position:fixed;inset:0;z-index:2000;background:rgba(15,17,20,.92);
  display:flex;align-items:center;justify-content:center;padding:40px;
  opacity:0;pointer-events:none;transition:opacity .2s ease}
.lightbox.aberta{opacity:1;pointer-events:auto}
.lightbox img{max-width:min(1100px,100%);max-height:100%;border-radius:4px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.97);transition:transform .2s ease}
.lightbox.aberta img{transform:scale(1)}
.lightbox-legenda{position:absolute;left:0;right:0;bottom:22px;text-align:center;
  font:500 12px/1.4 var(--sans);color:rgba(255,255,255,.85);letter-spacing:.02em}
.lightbox-fechar{position:absolute;top:22px;right:26px;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;
  font-size:16px;cursor:pointer;display:grid;place-items:center}
.lightbox-fechar:hover{background:rgba(255,255,255,.18)}
@media (prefers-reduced-motion: reduce){
  .lightbox,.lightbox img{transition:none}
}
</style>
</head>

const LUPA_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#15171a" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.3" y1="15.3" x2="21" y2="21"/></svg>';
const shot = (p,h) => p.foto
  ? '<div class="shot" data-foto="'+p.foto+'" data-legenda="'+p.nome+'" style="height:'+h+'px;background-image:url(\''+p.foto+'\')"><span class="lupa">'+LUPA_SVG+'</span></div>'
  : '<div class="shot empty" style="height:'+h+'px"><span>foto do painel<br>'+p.cod+'</span></div>';

/* ---------- estado ---------- */
const state = {sel:PONTOS[0].id, bairro:'todos', categoria:'todos'};
const bairros = [...new Set(PONTOS.map(p=>p.bairro))];
const markers = {};
let map;

/* ---------- mapa ---------- */
function initMap(){
  map = L.map('map',{zoomControl:false,attributionControl:true,fadeAnimation:false}).setView(CENTRO,ZOOM);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {minZoom:12,maxZoom:17,updateWhenIdle:true,attribution:'© OpenStreetMap contributors'}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  const icon = L.divIcon({className:'',iconSize:[34,40],iconAnchor:[17,40],
    html:'<div class="pin"><div class="halo"></div><div class="bubble"><img src="'+ONDA_ICONE+'" width="18" alt="" /></div><div class="tip"></div></div>'});
  PONTOS.forEach(p=>{
    const m = L.marker([p.lat,p.lng],{icon,title:p.nome}).addTo(map);
    m.on('click',()=>{state.sel=p.id;map.panTo([p.lat,p.lng],{animate:false});render();});
    markers[p.id]=m;
  });
}

/* ---------- render ---------- */
const mapsLink = p => 'https://maps.google.com/?q='+p.lat+','+p.lng;

function render(){
  document.getElementById('k-total').textContent    = PONTOS.length;
  document.getElementById('k-bairros').textContent  = bairros.length;
  document.getElementById('k-imp').textContent      = K(PONTOS.reduce((s,p)=>s+p.imp,0));

  const fc = document.getElementById('filtersCat');
  if(!fc.childElementCount)
    fc.innerHTML = ['todos',...CATEGORIAS].map(c=>'<button class="chip" data-c="'+c+'">'+(c==='todos'?'Todas as categorias':c)+'</button>').join('');
  fc.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.c===state.categoria));

  const f = document.getElementById('filters');
  if(!f.childElementCount)
    f.innerHTML = ['todos',...bairros].map(b=>'<button class="chip" data-f="'+b+'">'+(b==='todos'?'Todos os bairros':b)+'</button>').join('');
  f.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===state.bairro));

  const lista = PONTOS.filter(p=>
    (state.bairro==='todos'||p.bairro===state.bairro) &&
    (state.categoria==='todos'||p.categoria===state.categoria));

  document.getElementById('list').innerHTML = lista.length ? lista.map(p=>
    '<button class="row" data-p="'+p.id+'" aria-current="'+(p.id===state.sel)+'">'
    + '<div style="border-radius:6px;overflow:hidden">'+shot(p,54)+'</div>'
    + '<div><div style="display:flex;align-items:baseline;gap:8px">'
      + '<span class="mono-lbl" style="color:#b08a3d">'+p.cod+'</span></div>'
    + '<div class="row-name">'+p.nome+'</div>'
    + '<div class="row-meta"><span><b>'+p.tamanho+'</b></span><span><b>'+K(p.imp)+'</b> impactos/mês</span></div>'
    + '</div></button>').join('')
    : '<div class="vazio">Nenhum ponto nesta categoria ainda.</div>';

  Object.entries(markers).forEach(([id,m])=>{
    const el = m.getElement(); if(!el) return;
    const pto = PONTOS.find(p=>p.id===+id);
    const on = +id===state.sel;
    const vis = (state.bairro==='todos'||pto.bairro===state.bairro) && (state.categoria==='todos'||pto.categoria===state.categoria);
    el.querySelector('.pin').classList.toggle('sel',on);
    el.style.zIndex = on?'900':'';
    el.style.opacity = vis?'1':'.3';
  });

  const p = PONTOS.find(x=>x.id===state.sel);
  document.getElementById('detail').innerHTML =
    shot(p,168)
    + '<div style="padding:18px 20px 20px">'
    + '<div style="margin-bottom:8px"><span class="mono-lbl" style="color:#b08a3d">'+p.cod+'</span></div>'
    + '<div style="font-family:var(--serif);font-size:22px;line-height:1.2;letter-spacing:-.01em">'+p.nome+'</div>'
    + '<div class="endereco-linha">📍 <span>'+p.endereco+'</span></div>'
    + '<div class="pill-specs"><span class="pill-spec">📐 '+p.tamanho+'</span><span class="pill-spec">🖥️ '+p.resolucao+'</span></div>'
    + '<div class="impacto-linha">👁️ '+K(p.imp)+' impactos/mês</div>'
    + '<div class="insercoes-linha">▶️ '+p.insercoes+'</div>'
    + '<a class="link-maps" href="'+mapsLink(p)+'" target="_blank" rel="noopener">Ver no Google Maps ↗</a>'
    + (MOSTRAR_PRECO ? '<div style="display:flex;align-items:baseline;gap:8px;margin-top:16px">'
      + '<span class="num" style="font-size:24px;color:#b08a3d">'+BRL(p.preco)+'</span>'
      + '<span class="mono-lbl" style="color:rgba(21,23,26,.45)">/mês</span></div>' : '')
    + '</div>';
}

document.getElementById('filtersCat').onclick = e=>{
  const b=e.target.closest('[data-c]'); if(b){state.categoria=b.dataset.c;render();}
};
document.getElementById('filters').onclick = e=>{
  const b=e.target.closest('[data-f]'); if(b){state.bairro=b.dataset.f;render();}
};
document.getElementById('list').onclick = e=>{
  if(e.target.closest('[data-foto]'))return;
  const b=e.target.closest('[data-p]'); if(!b)return;
  state.sel=+b.dataset.p;
  const p=PONTOS.find(x=>x.id===state.sel);
  map.setView([p.lat,p.lng],map.getZoom(),{animate:false});
  render();
};

/* ---------- lightbox (foto ampliada) ---------- */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxLegenda = document.getElementById('lightbox-legenda');
function abrirLightbox(foto,legenda){
  lightboxImg.src = foto;
  lightboxLegenda.textContent = legenda || '';
  lightbox.classList.add('aberta');
}
function fecharLightbox(){
  lightbox.classList.remove('aberta');
  lightboxImg.src = '';
}
document.addEventListener('click', e=>{
  const s=e.target.closest('[data-foto]'); if(!s)return;
  e.stopPropagation();
  abrirLightbox(s.dataset.foto, s.dataset.legenda);
});
document.getElementById('lightbox-fechar').onclick = fecharLightbox;
lightbox.onclick = e=>{ if(e.target===lightbox) fecharLightbox(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') fecharLightbox(); });

initMap();
render();
</script>
</body>
</html>
